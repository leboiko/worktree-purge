#          env:
#            APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
#
# THE "GREEN RUN, NO ARTIFACTS" BUG THIS WORKFLOW GUARDS AGAINST
#   A sibling project's release workflow once had a `Create Release` step
#   silently fail on a missing tag context: `github.ref_name` resolves to the
#   pushed tag under a `push` trigger, but to the *branch name* under
#   `workflow_dispatch` — so a manual back-fill run would try to create a
#   release for "master" and either error confusingly or, worse, appear to
#   succeed while attaching nothing. The fix is the `RESOLVED_TAG` env below,
#   which every job reads instead of `github.ref_name` directly. On top of
#   that structural fix, this workflow also refuses to end in a "success"
#   state with zero (or a partial set of) artifacts: see the
#   "Verify artifacts downloaded" and "Verify GitHub Release has assets"
#   steps in the `release` job, which hard-fail the run with `::error::`
#   instead of letting a green checkmark hide a missing binary.

name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0) — used for manual back-fills"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Resolve the tag once at workflow level so every job uses the same value
  # regardless of trigger. See the header comment above for why this exists.
  RESOLVED_TAG: ${{ inputs.tag || github.ref_name }}
  # Expected platform-archive count: 4 Linux (gnu x86_64/aarch64, musl
  # x86_64/aarch64) + 2 macOS (x86_64/aarch64) + 1 Windows. Kept as a single
  # source of truth so the "Verify artifacts downloaded" guard in the
  # `release` job and this comment can't drift apart silently.
  EXPECTED_ARCHIVE_COUNT: 7

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RESOLVED_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build binary
        # `cross` handles cross-compilation for every non-native target
        # (aarch64-gnu, and both musl targets) via a Docker image with the
        # correct toolchain — no manual linker setup required. No `--package`
        # flag needed: worktree-purge is a single-crate repo, not a workspace.
        #
        # No manual strip step: Cargo.toml's [profile.release] already sets
        # `strip = true`, so every target's binary is stripped at build time
        # by cargo/rustc itself — including aarch64-unknown-linux-musl, for
        # which there is no standard apt-installable strip tool on
        # ubuntu-latest.
        run: cross build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          VERSION=${RESOLVED_TAG#v}
          STAGING="worktree-purge-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/worktree-purge "$STAGING/"
          cp LICENSE README.md "$STAGING/"
          TARBALL="${STAGING}.tar.gz"
          tar -czf "$TARBALL" "$STAGING"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: worktree-purge-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  build-macos:
    name: Build macOS (${{ matrix.target }})
    # Both targets build on macos-latest (Apple Silicon). The x86_64
    # target cross-compiles via `rustup target add x86_64-apple-darwin`
    # — the host toolchain handles it natively.
    #
    # NOTE: Binaries are NOT signed or notarized. See the comment block at
    # the top of this file for instructions on adding signing later.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RESOLVED_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}

      - name: Build binary
        # No manual strip step — see the note in build-linux; cargo strips
        # at build time via [profile.release] strip = true.
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          VERSION=${RESOLVED_TAG#v}
          STAGING="worktree-purge-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/worktree-purge "$STAGING/"
          cp LICENSE README.md "$STAGING/"
          TARBALL="${STAGING}.tar.gz"
          tar -czf "$TARBALL" "$STAGING"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: worktree-purge-${{ matrix.target }}
          path: ${{ env.TARBALL }}
          retention-days: 1

  build-windows:
    name: Build Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RESOLVED_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-pc-windows-msvc

      - name: Build binary
        # No manual strip step — cargo strips at build time via
        # [profile.release] strip = true.
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package zip
        shell: pwsh
        run: |
          $version = $env:RESOLVED_TAG -replace '^v',''
          $staging = "worktree-purge-${version}-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\worktree-purge.exe" $staging\
          Copy-Item "LICENSE" $staging\
          Copy-Item "README.md" $staging\
          $zipName = "${staging}.zip"
          Compress-Archive -Path $staging -DestinationPath $zipName
          "ZIPFILE=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: worktree-purge-x86_64-pc-windows-msvc
          path: ${{ env.ZIPFILE }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RESOLVED_TAG }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify artifacts downloaded
        # Refuse to proceed on a partial or empty artifact set instead of
        # silently publishing (or trying to publish) a release with missing
        # binaries. See the header comment for the incident this guards
        # against.
        working-directory: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*.tar.gz *.zip)
          count=${#archives[@]}
          echo "Found $count platform archive(s):"
          printf '  %s\n' "${archives[@]}"
          if [ "$count" -lt "$EXPECTED_ARCHIVE_COUNT" ]; then
            echo "::error::Expected $EXPECTED_ARCHIVE_COUNT platform archives but found $count. Failing loudly instead of shipping a release with missing artifacts." >&2
            exit 1
          fi

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create unversioned asset aliases
        working-directory: artifacts
        run: |
          # Mirror each versioned archive under a stable filename so
          # https://github.com/<owner>/<repo>/releases/latest/download/<unversioned>
          # resolves. SHA256SUMS only references the versioned canonical
          # files; the aliases are convenience pointers with identical
          # bytes.
          shopt -s nullglob
          for f in worktree-purge-*.tar.gz worktree-purge-*.zip; do
            unversioned=$(echo "$f" | sed -E 's/^(worktree-purge)-[0-9]+\.[0-9]+\.[0-9]+-/\1-/')
            if [ "$f" != "$unversioned" ]; then
              cp "$f" "$unversioned"
            fi
          done

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION=${RESOLVED_TAG#v}
          if [ -f CHANGELOG.md ]; then
            # Extract the block between ## [version] and the next ## [
            BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          else
            BODY="Release ${RESOLVED_TAG}"
          fi
          if [ -z "$BODY" ]; then
            BODY="Release ${RESOLVED_TAG}. See CHANGELOG.md for details."
          fi
          printf '%s' "$BODY" > release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RESOLVED_TAG }}
          body_path: release_notes.md
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub Release has assets
        # Belt-and-suspenders check on the published release itself, not
        # just the local artifacts/ dir — catches the exact "release
        # created, but nothing attached" shape of the incident this
        # workflow is designed to prevent, even if some future refactor
        # reintroduces it via a different code path.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=$(gh release view "$RESOLVED_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "Release $RESOLVED_TAG has $count asset(s) attached."
          if [ "$count" -lt 1 ]; then
            echo "::error::Release $RESOLVED_TAG was created but has zero assets attached. Failing loudly instead of leaving a green run with an empty release." >&2
            exit 1
          fi

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Only after the GitHub Release exists and has been verified to carry
    # assets. crates.io publishes are irreversible — a version can be yanked
    # but never replaced — so it goes last, once everything else has proven
    # itself.
    needs: [release]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RESOLVED_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Check for a registry token
        # A missing token must skip the publish, not fail the release that
        # already shipped successfully. Secrets cannot be read in a job-level
        # `if`, so the check happens here and gates the steps below.
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set — skipping the crates.io publish. Add the secret to enable it."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the tag matches the crate version
        if: steps.token.outputs.present == 'true'
        # Publishing a version that disagrees with the tag produces a release
        # whose binaries and registry entry describe different things.
        run: |
          set -euo pipefail
          manifest=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name=="worktree-purge") | .version')
          expected=${RESOLVED_TAG#v}
          echo "tag=$expected manifest=$manifest"
          if [ "$manifest" != "$expected" ]; then
            echo "::error::Tag $RESOLVED_TAG implies version $expected but Cargo.toml says $manifest." >&2
            exit 1
          fi

      - name: Publish
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Verify the version is live on crates.io
        if: steps.token.outputs.present == 'true'
        # "cargo publish succeeded" is not the same as "the version is
        # downloadable" — the index takes a moment to catch up, and a silent
        # failure here is exactly the kind of thing that only surfaces when a
        # user runs `cargo install`.
        run: |
          set -euo pipefail
          version=${RESOLVED_TAG#v}
          for attempt in $(seq 1 20); do
            if curl -sSf -A "worktree-purge release workflow" \
                "https://index.crates.io/wo/rk/worktree-purge" \
              | jq -e --arg v "$version" 'select(.vers == $v)' >/dev/null; then
              echo "worktree-purge $version is live on crates.io."
              exit 0
            fi
            echo "attempt $attempt: $version not visible yet; waiting."
            sleep 15
          done
          echo "::error::worktree-purge $version never appeared on the crates.io index after publishing." >&2
          exit 1
