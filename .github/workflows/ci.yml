name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a fully supported, CI-tested tier for worktree-purge
        # (not an oversight) — the release pipeline ships a Windows binary,
        # so clippy must pass there too.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # MSRV is 1.88, from Cargo.toml's `rust-version`. Test stable + the floor.
        toolchain: [stable, "1.88"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
      - name: Configure git identity for test fixtures
        # Integration tests shell out to real `git` and build real
        # repositories/commits in temp dirs (see tests/common/mod.rs). The
        # fixture helper already passes GIT_AUTHOR_*/GIT_COMMITTER_* env vars
        # and `-c init.defaultBranch=main` per invocation, so it doesn't
        # strictly need this — but a fresh runner has no git identity or
        # default-branch config at all, and any test added later that shells
        # out to `git init`/`git commit` directly (without going through the
        # shared fixture helper) would otherwise fail with
        # "unable to auto-detect email address" on a brand-new runner. Cheap
        # insurance, configured once before the whole test job runs.
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
        # --no-fail-fast so a failure in one test binary does not hide the
        # results of the others. Without it cargo stops at the first failing
        # target, which turns a platform-specific problem into one fix per CI
        # round-trip instead of one round-trip for all of them.
      - run: cargo test --no-fail-fast

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources advisories
