[package]
name = "worktree-purge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI for finding and reclaiming disk space from stale git worktrees"
license = "MIT"
repository = "https://github.com/leboiko/worktree-purge"
homepage = "https://github.com/leboiko/worktree-purge"
keywords = ["git", "worktree", "tui", "disk-usage", "ratatui"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = ["docs/screenshots/*", "SCOPE.md"]

[[bin]]
name = "worktree-purge"
path = "src/main.rs"

[lib]
name = "worktree_purge"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
filesize = "0.2.0"
ignore = "0.4.33"
ratatui = "0.30.2"
rayon = "1.12.0"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
